name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing pushed version tag to release (for example v1.0.0-rc1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@b9bee63ef481cc545e4517ec730544a4d8b1dfa0 # v6.4.0

      - name: Install pinned Android SDK packages
        run: sdkmanager --install "platforms;android-37" "build-tools;36.0.0"

      - name: Validate tag and derive Android version
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag_name="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if [[ ! "$tag_name" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc([1-9][0-9]*))?$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rcN." >&2
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          prerelease="${BASH_REMATCH[4]}"
          rc_number="${BASH_REMATCH[5]}"
          if (( ${#major} > 3 || ${#minor} > 2 || ${#patch} > 2 || ${#rc_number} > 3 )); then
            echo "Version components exceed the supported version-code scheme." >&2
            exit 1
          fi
          if (( minor > 99 || patch > 99 )); then
            echo "MINOR and PATCH must each be less than 100." >&2
            exit 1
          fi

          if [[ -n "$rc_number" ]]; then
            if (( rc_number > 998 )); then
              echo "RC number must be between 1 and 998." >&2
              exit 1
            fi
            version_suffix="$rc_number"
            is_prerelease=true
          else
            version_suffix=999
            is_prerelease=false
          fi

          version_name="${major}.${minor}.${patch}${prerelease}"
          version_code=$((major * 10000000 + minor * 100000 + patch * 1000 + version_suffix))
          if (( version_code > 2100000000 )); then
            echo "Derived Android versionCode exceeds the supported limit." >&2
            exit 1
          fi

          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"

      - name: Load release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Configure all ANDROID_RELEASE_* repository secrets before publishing a release." >&2
            exit 1
          fi

          keystore="$RUNNER_TEMP/habitcounter-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "ANDROID_RELEASE_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: Build and compare unsigned APKs
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          ./gradlew --no-daemon --max-workers=1 clean :app:assembleRelease \
            "-PreleaseVersionName=$VERSION_NAME" \
            "-PreleaseVersionCode=$VERSION_CODE"

          unsigned_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          cp "$unsigned_apk" "$RUNNER_TEMP/first-build.apk"

          ./gradlew --no-daemon --max-workers=1 clean :app:assembleRelease \
            "-PreleaseVersionName=$VERSION_NAME" \
            "-PreleaseVersionCode=$VERSION_CODE"
          cmp "$RUNNER_TEMP/first-build.apk" "$unsigned_apk"

      - name: Sign verified APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          unsigned_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          apk="HabitCounter-$VERSION_NAME.apk"

          "$build_tools/zipalign" -c -v 4 "$unsigned_apk"
          "$build_tools/apksigner" sign \
            --ks "$ANDROID_RELEASE_KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$apk" \
            "$unsigned_apk"
          "$build_tools/apksigner" verify --verbose "$apk"

          echo "RELEASE_APK=$apk" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          IS_PRERELEASE: ${{ steps.version.outputs.is_prerelease }}
        run: |
          release_flags=()
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$TAG_NAME" "$RELEASE_APK" \
            --title "HabitCounter $VERSION_NAME" \
            --generate-notes \
            "${release_flags[@]}"
