name: Update dependency verification metadata

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@b9bee63ef481cc545e4517ec730544a4d8b1dfa0 # v6.4.0

      - name: Install pinned Android SDK packages
        run: sdkmanager --install "platforms;android-37.2" "build-tools;36.0.0"

      - name: Resolve build configurations and update verification metadata
        run: |
          ./gradlew --no-daemon --max-workers=1 clean \
            :app:assembleRelease \
            :app:testDebugUnitTest \
            :app:lintDebug \
            --write-verification-metadata sha256 \
            --console=plain

      - name: Open metadata update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          base: main
          branch: automation/update-dependency-verification
          delete-branch: true
          add-paths: gradle/verification-metadata.xml
          commit-message: Refresh Gradle dependency verification metadata
          title: Refresh Gradle dependency verification metadata
          body: |
            This PR updates Gradle dependency verification checksums by resolving
            the release, KSP, unit-test, and lint configurations on Ubuntu 24.04.

            Review every added or changed component against its trusted repository
            before merging. This workflow only stages `gradle/verification-metadata.xml`.
